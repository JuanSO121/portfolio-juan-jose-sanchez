    <link rel="icon" type="image/svg+xml" href="/JS.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Juan José Sánchez — Desarrollador Full Stack</title>

    />
    <meta name="author" content="Juan José Sánchez Ocampo" />
    <meta name="theme-color" content="#0b0b10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f7f9" media="(prefers-color-scheme: light)" />

    <!-- Vista previa al compartir el enlace por LinkedIn o WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Juan José Sánchez — Desarrollador Full Stack" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Aplica el tema ANTES del primer pintado. Sin esto la página
         aparece en claro y salta a oscuro un instante después. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
